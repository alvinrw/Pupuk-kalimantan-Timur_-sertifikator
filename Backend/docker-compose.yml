services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sertifikator_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sertifikator_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # -------------------------------------------------------------
  # 2. MinIO Object Storage (S3 Compatible)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: sertifikator_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # -------------------------------------------------------------
  # 2.1 Auto-Create MinIO Bucket (Init Container)
  # -------------------------------------------------------------
  createbuckets:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: sertifikator_create_buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/sertifikator-docs;
      /usr/bin/mc anonymous set download myminio/sertifikator-docs;
      echo 'Bucket sertifikator-docs created successfully!';
      exit 0;
      "

  # -------------------------------------------------------------
  # 3. Redis Queue
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sertifikator_redis
    restart: always
    ports:
      - "6379:6379"

  # -------------------------------------------------------------
  # 4. NestJS Main API Service
  # -------------------------------------------------------------
  nest-api:
    build:
      context: ./nest-api
      dockerfile: Dockerfile
    container_name: sertifikator_nest_api
    restart: always
    ports:
      - "3005:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/sertifikator_db?schema=public"
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET_NAME: "sertifikator-docs"
      FASTAPI_OCR_URL: "http://fastapi-ocr:8000"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - minio
      - createbuckets
      - redis

  # -------------------------------------------------------------
  # 5. FastAPI OCR Service
  # -------------------------------------------------------------
  fastapi-ocr:
    build:
      context: ./fastapi-ocr
      dockerfile: Dockerfile
    container_name: sertifikator_fastapi_ocr
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ENV: "production"
    depends_on:
      - redis

volumes:
  postgres_data:
  minio_data:
